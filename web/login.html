<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Estaciona AI</title>
  <meta name="description" content="Acesse o painel do Estaciona AI">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 10% 20%, rgba(28, 167, 69, 0.05) 0%, transparent 20%), 
                        radial-gradient(circle at 90% 80%, rgba(28, 167, 69, 0.08) 0%, transparent 20%);
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      margin-top: 2rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: var(--border-radius);
      padding: 2.5rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      transform: translateY(0);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12), 0 5px 15px rgba(28, 167, 69, 0.05);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h2 {
      font-size: 2rem;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .login-header p {
      color: var(--text-light);
      font-size: 1rem;
      margin-bottom: 0;
    }

    /* Tabs Styling */
    .auth-tabs {
      display: flex;
      margin-bottom: 2rem;
      border-bottom: 2px solid rgba(0,0,0,0.05);
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.75rem 0;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-light);
      transition: all 0.3s;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }

    .auth-tab.active {
      color: var(--primary-green);
      border-bottom-color: var(--primary-green);
    }

    .auth-tab:hover:not(.active) {
      color: var(--text-dark);
    }

    .form-section {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .form-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .form-control {
      width: 100%;
      padding: 1rem 1.25rem;
      font-family: var(--font-main);
      font-size: 1rem;
      color: var(--text-dark);
      background-color: rgba(255, 255, 255, 0.9);
      border: 2px solid transparent;
      border-radius: 12px;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .form-control:focus {
      border-color: var(--primary-green);
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(28, 167, 69, 0.1);
    }

    .form-label {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 1rem;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .form-control:focus ~ .form-label,
    .form-control:not(:placeholder-shown) ~ .form-label {
      top: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-dark);
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,1) 100%);
      padding: 0 0.5rem;
      transform: translateY(-50%) translateX(-0.5rem);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      color: var(--text-dark);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .checkbox-group input {
      margin-right: 0.75rem;
      width: 1.2rem;
      height: 1.2rem;
      accent-color: var(--primary-green);
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      margin-top: 0.5rem;
      padding: 1rem;
      font-size: 1.125rem;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
    }

    .btn-login .spinner {
      display: none;
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .btn-login.loading {
      color: transparent;
      pointer-events: none;
    }

    .btn-login.loading .spinner {
      display: block;
    }

    .utilities-row {
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 1.5rem; 
      font-size: 0.9rem;
    }
  </style>
  <link rel="stylesheet" href="css/experience.css?v=4">
</head>

<body class="login-page">
    <canvas aria-hidden="true" id="login-gl" style="position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></canvas>
  <nav class="navbar" style="position: absolute;">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-text">Estaciona</span>
        <div class="logo-pin"><span>AI</span></div>
      </a>
    </div>
  </nav>

  <main class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h2>Acesse o campus digital</h2>
        <p>Consulte as vagas e planeje seu trajeto pelo estacionamento.</p>
      </div>
      
      <!-- FORM: DEMO LOGIN -->
      <form id="demoForm" class="form-section active" onsubmit="handleDemoLogin(event)">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h3 style="color: var(--primary-green); margin-bottom: 0.5rem;">Acesso demonstrativo, sem senha</h3>
          <p style="color: var(--text-light); font-size: 0.9rem;">Escolha o seu perfil para explorar as funcionalidades.</p>
        </div>

        <div class="form-group">
          <input type="text" id="demoName" class="form-control" placeholder=" " value="Visitante" required>
          <label for="demoName" class="form-label">Nome de exibição</label>
        </div>
        
        <div class="form-group" style="margin-bottom: 2rem;">
          <p style="color: var(--text-dark); margin-bottom: 0.8rem; font-weight: 500;">Escolha uma visão:</p>
          <label style="display: flex; align-items: center; cursor: pointer; color: var(--text-dark); margin-bottom: 0.5rem;">
            <input type="radio" name="demoRole" value="viewer" checked style="margin-right: 0.5rem; accent-color: var(--primary-green);">
            Usuário · mapa do campus
          </label>
          <label style="display: flex; align-items: center; cursor: pointer; color: var(--text-dark);">
            <input type="radio" name="demoRole" value="admin" style="margin-right: 0.5rem; accent-color: var(--primary-green);">
            Administrador · centro de controle
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-login" id="demoBtn">
          <span>Entrar na prévia ↗</span>
          <div class="spinner"></div>
        </button>
      </form>

      <p class="login-context">Pesquisa e tecnologia aplicadas à mobilidade na Uniube.</p>
    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const isLoggedIn = localStorage.getItem('estaciona_logged_in') || sessionStorage.getItem('estaciona_logged_in');
      if (isLoggedIn === 'true') {
        const role = localStorage.getItem('estaciona_role') || sessionStorage.getItem('estaciona_role') || 'viewer';
        if (role === 'admin') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'app.html';
        }
      }
    });

    function handleDemoLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('demoBtn');
      const name = document.getElementById('demoName').value.trim();
      const role = document.querySelector('input[name="demoRole"]:checked').value;

      btn.classList.add('loading');
      
      setTimeout(() => {
        // Fake login
        sessionStorage.setItem('estaciona_logged_in', 'true');
        sessionStorage.setItem('estaciona_user', 'demo@estaciona.tech');
        sessionStorage.setItem('estaciona_name', name || 'Visitante');
        sessionStorage.setItem('estaciona_id', 'demo-12345');
        sessionStorage.setItem('estaciona_token', 'demo-token');
        sessionStorage.setItem('estaciona_role', role);
        
        // Mock token cookie for dashboard check
        document.cookie = "estaciona_token=demo-token; path=/";

        if (role === 'admin') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'app.html';
        }
      }, 800); // add a slight delay for realistic feel
    }
  </script>
    <script type="module" src="js/login-webgl.js?v=2"></script>
  </body>
</html>
