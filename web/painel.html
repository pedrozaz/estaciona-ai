<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Demo — Estaciona AI</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body {
        font-family: var(--font-main, -apple-system, sans-serif);
        background: #0f1117;
        color: #e2e8f0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .dashboard-nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.25rem;
        background: rgba(15, 17, 23, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        z-index: 100;
      }

      .dashboard-nav .logo {
        display: flex; align-items: center; text-decoration: none;
      }

      .dashboard-nav .logo-text {
        font-size: 1.4rem; font-weight: 700; color: #e2e8f0; letter-spacing: -0.5px;
      }

      .dashboard-nav .logo-pin {
        display: flex; align-items: center; justify-content: center;
        background-color: #1ca745; color: #fff;
        font-weight: 800; font-size: 0.75rem;
        height: 28px; width: 28px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        margin-left: 5px; margin-top: -4px;
        box-shadow: 0 2px 8px rgba(28, 167, 69, 0.35);
      }
      .dashboard-nav .logo-pin span { transform: rotate(45deg); }

      .content {
        margin-top: 80px;
        padding: 0 2rem;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
        padding-bottom: 3rem;
      }

      .header-title {
        margin-bottom: 2rem;
      }

      .header-title h1 {
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .header-title p {
        color: #94a3b8;
        font-size: 0.95rem;
      }

      .actions {
        display: flex;
        gap: 1rem;
        margin-bottom: 2.5rem;
      }

      .btn {
        padding: 0.6rem 1.25rem;
        border-radius: 6px;
        border: none;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s;
        color: #fff;
      }

      .btn-free { background: #1ca745; }
      .btn-free:hover { background: #158a38; }

      .btn-occ { background: #dc3545; }
      .btn-occ:hover { background: #c82333; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 1rem;
      }

      .spot-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 1rem 0;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
      }

      .spot-card:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      .spot-card.free {
        border-bottom: 3px solid #1ca745;
      }

      .spot-card.occupied {
        border-bottom: 3px solid #dc3545;
        background: rgba(220, 53, 69, 0.05);
      }

      .spot-card.loading {
        opacity: 0.5;
        pointer-events: none;
      }

      .spot-id {
        font-weight: 600;
        font-size: 1.1rem;
        margin-bottom: 0.25rem;
      }

      .spot-status {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .spot-card.free .spot-status { color: #1ca745; }
      .spot-card.occupied .spot-status { color: #dc3545; }
    </style>
  </head>
  <body>
    <nav class="dashboard-nav">
      <a href="#" class="logo">
        <div class="logo-text">estaciona.ai</div>
        <div class="logo-pin"><span>P</span></div>
      </a>
      <div class="nav-right">
        <span style="font-size: 0.85rem; color: #94a3b8;">Feira Showcase</span>
      </div>
    </nav>

    <div class="content">
      <div class="header-title">
        <h1>Painel de Controle - Manual</h1>
        <p>Altere o status das vagas em tempo real no banco de dados. As alterações refletirão instantaneamente no mapa 3D via WebSocket.</p>
      </div>

      <div class="actions">
        <button class="btn btn-free" onclick="resetAll()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l5.67-1.42"/></svg>
          Liberar Todas
        </button>
        <button class="btn btn-occ" onclick="fillAll()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Ocupar Todas
        </button>
      </div>

      <div class="grid" id="grid"></div>
    </div>

    <script>
      const API_URL = "https://api.estaciona.tech";
      const TOKEN = "demo-token";

      const grid = document.getElementById('grid');
      const spots = Array.from({length: 44}, (_, i) => `A-${String(i+1).padStart(2, '0')}`);
      const spotStates = {};

      spots.forEach(id => {
          spotStates[id] = 'free';
          
          const card = document.createElement('div');
          card.className = 'spot-card free';
          card.id = `card-${id}`;
          card.onclick = () => toggleSpot(id);
          
          const title = document.createElement('div');
          title.className = 'spot-id';
          title.innerText = id;
          
          const stat = document.createElement('div');
          stat.className = 'spot-status';
          stat.id = `stat-${id}`;
          stat.innerText = 'LIVRE';
          
          card.appendChild(title);
          card.appendChild(stat);
          grid.appendChild(card);
      });

      async function setSpotStatus(id, status) {
          const card = document.getElementById(`card-${id}`);
          const stat = document.getElementById(`stat-${id}`);
          card.classList.add('loading');
          
          try {
              const res = await fetch(`${API_URL}/spots/${id}/status`, {
                  method: 'PUT',
                  headers: {
                      'Content-Type': 'application/json',
                      'Authorization': `Bearer ${TOKEN}`
                  },
                  body: JSON.stringify({ status })
              });
              
              if (res.ok) {
                  spotStates[id] = status;
                  if (status === 'occupied') {
                      card.classList.remove('free');
                      card.classList.add('occupied');
                      stat.innerText = 'OCUPADA';
                  } else {
                      card.classList.remove('occupied');
                      card.classList.add('free');
                      stat.innerText = 'LIVRE';
                  }
              }
          } catch (err) {
              console.error(`Erro ao atualizar ${id}:`, err);
          }
          
          card.classList.remove('loading');
      }

      async function toggleSpot(id) {
          const newStatus = spotStates[id] === 'free' ? 'occupied' : 'free';
          await setSpotStatus(id, newStatus);
      }

      async function resetAll() {
          if(!confirm("Liberar todas as 44 vagas no banco de dados da Azure?")) return;
          await Promise.all(spots.map(id => setSpotStatus(id, 'free')));
      }

      async function fillAll() {
          if(!confirm("Ocupar todas as 44 vagas no banco de dados da Azure?")) return;
          await Promise.all(spots.map(id => setSpotStatus(id, 'occupied')));
      }
    </script>
  </body>
</html>
